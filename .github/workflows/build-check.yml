name: Build Check

# Builds every publishable workspace package using the same script the release
# workflow runs. A green PR here is a strong signal that `pnpm release` on main
# will succeed too. Also builds the docs site so we catch MDX/Astro regressions.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@b307475762933b98ed359c036b0e51f26b63b74b # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all publishable packages
        run: pnpm build:all

      - name: Build docs site
        run: pnpm site:build

      - name: Generated llms.txt is committed
        # `site:build` regenerates apps/site/public/llms.txt from the page
        # tree (prebuild runs `llms:gen`). The file is committed because it is
        # served as a static asset, and until this check existed nothing
        # compared the committed copy with the freshly generated one: CI
        # rebuilt it into its own output and threw it away, so the file sat at
        # v2.8.0 through a 3.0.0 release. Fix a failure by regenerating and
        # committing:
        #   pnpm site:build && git add apps/site/public/llms.txt
        run: git diff --exit-code -- apps/site/public/llms.txt

      - name: Bundle size check
        # Fails the PR when the library's gzipped dist grows more than
        # DRIFT_TOLERANCE_PCT (10%) over ci/size-baseline.json. One-sided:
        # shrinking never fails. Growth that is intentional is accepted by
        # rewriting the baseline, which the failure message spells out:
        #   node scripts/size-check.mjs --update && git add ci/size-baseline.json
        run: pnpm size:check
