question: How do I place a 2x2 symbol on the board?
answer: "Give the id `size: { reels: 2, cells: 2 }` via `.symbolData(...)` and `weight:
  0` via `.weights(...)`, place its anchor cell via `setResult`, and the engine
  paints OCCUPIED across the block."
