id: chars-011
group: chars
question: How do I sequence many throws so they arrive one after another?
answer: >-
  `coinWaves(items, 'sequence')` plus a per-item `delay` on `bezierFly` stagger the throws to arrive one after another. Those helpers are demo code in `apps/site/src/runtime/holdAndWinFx.ts`, not exports of the `pixi-reels` package -- copy them into your project.
