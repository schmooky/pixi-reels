id: chars-004
group: chars
question: How do I make a fisherman collect every money-fish on the board?
answer: >-
  On collect, walk the money-symbol cells and `bezierFly` each value into the character; the board only gives you `cellCenter` + the payloads. Those helpers are example code in `examples/shared/`, not exports of the `pixi-reels` package -- copy them into your project.
