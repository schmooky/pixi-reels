id: anim-008
group: anim
question: How do I play an arbitrary named Spine animation on a symbol?
answer: "`await symbol.playOneShot(name)` plays it once on `SpineReelSymbol` and
  resolves when it ends, then returns the track to idle; pass `{ track: 1 }` for
  an overlay (cleared after) or `{ then: 'hold' }` to keep the last frame. For a
  loop, `symbol.playOnTrack(track, name, true)`, or reach the skeleton via the
  `.spine` getter."
