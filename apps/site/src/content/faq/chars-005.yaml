id: chars-005
group: chars
topic: hold-and-win
question: How do I fly each collected symbol's value into the character's pouch
  and total it?
answer: >-
  `bezierFly` the value clone to the character's position and add it to your running total in the arrival callback. Those helpers are demo code in `packages/kit/src/holdAndWinFx.ts`, not exports of the `pixi-reels` package -- copy them into your project.
