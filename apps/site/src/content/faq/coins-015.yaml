id: coins-015
group: coins
topic: hold-and-win
question: How do I make a row/column of cells all act as collectors that sweep the board?
answer: >-
  Use the shared `coinWaves(coins, 'by-cell' | 'by-reel')` helper (copy it from
  `packages/kit/src/holdAndWinFx.ts`) to order the sweep, and `bezierFly`
  each value into the collector cell, optionally trailed by particle streams.
links:
