topic: hold-and-win
question: How do I tick the collector total up as each value lands on it?
answer: >-
  Increment the collector total in the `bezierFly().then(...)` arrival callback. Those helpers are demo code in `packages/kit/src/holdAndWinFx.ts`, not exports of the `pixi-reels` package -- copy them into your project.
