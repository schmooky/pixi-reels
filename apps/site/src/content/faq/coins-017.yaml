id: coins-017
group: coins
topic: hold-and-win
question: How do I send collected coins flying to a feature meter above the reels?
answer: >-
  `board.cellCenter(cell)` gives the start; `bezierFly` to your meter's screen position with `arriveScale` to shrink it in. Those helpers are demo code in `packages/kit/src/holdAndWinFx.ts`, not exports of the `pixi-reels` package, copy them into your project.
