id: chars-003
group: chars
question: How do I make the character react (chomp, bounce) when a coin hits it?
answer: >-
  Resolve the `bezierFly` promise on arrival and play the character's reaction in the `.then(...)`. Those helpers are demo code in `apps/site/src/runtime/holdAndWinFx.ts`, not exports of the `pixi-reels` package -- copy them into your project.
