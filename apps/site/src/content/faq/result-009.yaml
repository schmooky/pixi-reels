id: result-009
group: result
topic: big-symbols
question: How do I land a different row count on each reel in one result?
answer: Build with `.multiways({ minCells, maxCells, reelExtent })` and pass a per-reel
  `ColumnTarget[]` whose `visible` arrays differ in length.
