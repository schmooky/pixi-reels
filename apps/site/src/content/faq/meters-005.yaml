id: meters-005
group: meters
question: How do I animate a value flying into the meter and bumping it up?
answer: >-
  `bezierFly` the value to the meter's screen position with `arriveScale` and bump it in the arrival callback. Those helpers are example code in `examples/shared/`, not exports of the `pixi-reels` package -- copy them into your project.
