id: coins-021
group: coins
question: How do I order the collect flights by row, by column, or all at once?
answer: >-
  The shared `coinWaves(board.lockedCoins, 'by-reel')` helper -- also
  `'by-cell'`, `'sequence'`, `'all'`, `{ chunk }`, or a custom
  `(item, index) => waveIndex` -- groups the flights into waves. It lives in
  `examples/shared/holdAndWinFx.ts`, not the package.
