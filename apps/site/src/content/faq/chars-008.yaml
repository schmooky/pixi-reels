id: chars-008
group: chars
topic: hold-and-win
question: How do I have a special symbol shoot/affect another cell (sniper style)?
answer: Read both cells' geometry from `getCellBounds`, fly an effect between
  them, and swap the target via `setSymbolAt` or a pin.
