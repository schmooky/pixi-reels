id: wilds-003
group: wilds
question: How do I make a wild walk one reel left each respin?
answer: >-
  `await reelSet.movePin({ reel: fromReel, cell }, { reel: fromReel - 1, cell })`
  shifts the wild one reel left each respin, with a flight animation.
links:
