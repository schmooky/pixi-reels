id: result-010
group: result
topic: big-symbols
question: How do I send a structured result that survives JSON or postMessage?
answer: Use the explicit `ColumnTarget` object form (`{ visible, bufferStart,
  bufferEnd }`). It survives JSON or postMessage, unlike the negative-index
  array form.
