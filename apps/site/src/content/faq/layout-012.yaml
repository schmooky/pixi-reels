id: layout-012
group: layout
question: Does the horizontal banner reel use the same spin API as ReelSet, or a
  different one?
answer: The same one. `HorizontalReel` exposes `spin()`, `setResult(...)`,
  `skipSpin()`, `isSpinning`, and the `spin:start` / `spin:complete` events —
  mirroring `ReelSet`. The only shape difference is that `setResult` takes a flat
  `string[]` of `visibleCount` ids (one row) instead of a `ColumnTarget[]` grid,
  because it is a single row. `spin()` returns a promise that resolves with the
  landed `{ symbols }`, so the "spin, await the server, setResult, await the
  land" flow is identical to a normal reel.
