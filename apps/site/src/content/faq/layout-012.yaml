id: layout-012
group: layout
topic: orientation-and-direction
question: Can the horizontal banner reel cascade like the main reels when a
  symbol was part of a win?
answer: >-
  Yes -- the banner is a plain `ReelSet`, so it uses the same cascade API as the
  main board. Build it with `.orientation('horizontal')` plus
  `.tumble({ fall, dropIn })`, then `await reelSet.refill({ winners, grid })`
  with the winning `Cell`s (`{ reel, cell }`) and the next `ColumnTarget[]`, or
  `await reelSet.runCascade({ detectWinners, nextGrid })` for the whole
  destroy-refill-check loop. Progress is observable through `cascade:fall:*`,
  `cascade:dropIn:*` and `cascade:chain:end`.
