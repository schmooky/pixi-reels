id: coins-022
group: coins
question: How do I curve the collect flight toward the screen edge or center?
answer: >-
  `bezierFly(..., { lean: 'up' | 'down' | 'in' | 'out', curvature })` bends the arc; `around` sets the in/out reference point. Those helpers are demo code in `apps/site/src/runtime/holdAndWinFx.ts`, not exports of the `pixi-reels` package -- copy them into your project.
